services:
  db:
    image: postgres:17
    container_name: kopyaq-db
    environment:
      POSTGRES_USER: kopyaq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kopyaq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kopyaq -d kopyaq"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: